name: Scrape Discord

on:
  schedule:
    - cron: '30 */8 * * *'  # Every 8 hours (will fail gracefully until bot is set up)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Stub — fails gracefully until Discord bot is configured

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements-scrapers.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements-scrapers.txt

      - name: Run scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_IDS: ${{ secrets.DISCORD_GUILD_IDS }}
        run: python discord_scraper.py
