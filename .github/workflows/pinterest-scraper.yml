name: Scrape Pinterest

on:
  schedule:
    - cron: '0 10 * * *'  # Daily at 10:00 UTC (will fail gracefully until credentials added)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Stub — fails gracefully until Pinterest API access is approved

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements-scrapers.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements-scrapers.txt

      - name: Run scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: python pinterest_scraper.py
