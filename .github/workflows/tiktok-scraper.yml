name: Scrape TikTok

on:
  schedule:
    - cron: '15 */6 * * *'  # Every 6 hours (will fail gracefully until credentials added)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Stub — fails gracefully until TikTok Research API access is approved

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements-scrapers.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements-scrapers.txt

      - name: Run scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python tiktok_scraper.py
