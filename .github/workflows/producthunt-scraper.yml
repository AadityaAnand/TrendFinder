name: Scrape Product Hunt

on:
  schedule:
    - cron: '0 15 * * *'  # Daily at 3 PM UTC (after PH daily reset at noon PT)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements-scrapers.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements-scrapers.txt

      - name: Run scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PRODUCTHUNT_API_TOKEN: ${{ secrets.PRODUCTHUNT_API_TOKEN }}
        run: python producthunt_scraper.py
